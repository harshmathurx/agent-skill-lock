name: Feature request
description: Suggest a config surface, parser, or workflow improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What agent config or review workflow should this improve?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example config or diff
      description: Remove secrets before pasting.
  - type: textarea
    id: proposed
    attributes:
      label: Proposed behavior
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the project focused on lockfile drift rather than scanner findings.
          required: true
